name: Infra cluster deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Image environment
        required: true
        type: string
      image-tags:
        description: Docker image with tag
        required: true
        type: string
    secrets:
      AKS_INFRA_FINT_GITHUB:
        required: true

env:
  INFRA_CLUSTER_NAME: aks-infra-fint-2021-12-27
  INFRA_CLUSTER_RESOURCE_GROUP: rg-aks-infra

jobs:
  deploy-to-cluster:
    name: Deploy ${{ inputs.environment }} image to infra
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Bake infra manifests with Kustomize
        id: bake
        uses: azure/k8s-bake@v4.1.1
        with:
          renderEngine: kustomize
          kustomizationPath: kustomize/base

      - name: Azure login
        uses: azure/login@v3.1.0
        with:
          creds: ${{ secrets.AKS_INFRA_FINT_GITHUB }}

      - name: Set the target infra cluster
        uses: azure/aks-set-context@v5.0.1
        with:
          cluster-name: ${{ env.INFRA_CLUSTER_NAME }}
          resource-group: ${{ env.INFRA_CLUSTER_RESOURCE_GROUP }}
          admin: 'true'
          use-kubelogin: 'true'

      - name: Deploy to infra
        uses: azure/k8s-deploy@v7.0.1
        with:
          action: deploy
          manifests: ${{ steps.bake.outputs.manifestsBundle }}
          images: ${{ inputs.image-tags }}
          pull-images: 'false'
          namespace: default
